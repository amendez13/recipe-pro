name: Secret Scanning

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scanning-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: [self-hosted, fargate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks binary
        run: |
          set -euo pipefail

          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"

          curl -sSL -o "${archive}" "${url}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -

          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks

      - name: Scan git history with gitleaks
        id: scan
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git cat-file -e "${PR_BASE_SHA}^{commit}"
            log_opts="--full-history --diff-merges=first-parent ${PR_BASE_SHA}..${SCAN_HEAD_SHA}"
          else
            log_opts="--full-history --diff-merges=first-parent ${SCAN_HEAD_SHA}"
          fi

          git cat-file -e "${SCAN_HEAD_SHA}^{commit}"
          # Gitleaks 8.30.1 can return zero after a Git traversal error.
          git log -p -U0 ${log_opts} > /dev/null

          scan_status=0
          ./gitleaks git . \
            --log-opts="${log_opts}" \
            --no-banner \
            --no-color \
            --log-level error \
            --redact=100 \
            --report-format sarif \
            --report-path gitleaks.sarif 2> gitleaks-errors.log || scan_status=$?

          if [ -s gitleaks-errors.log ]; then
            echo "::error::Gitleaks reported scanner errors; the scan is incomplete."
            exit 1
          fi
          exit "$scan_status"

      - name: Upload redacted SARIF to GitHub code scanning when supported
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Upload redacted gitleaks report artifact
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: error

      - name: Fail when leaks are detected
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Gitleaks detected potential secrets. Review the Secret Scanning job output and rotate or remove any exposed credentials."
          exit 1
