web:
  host: "127.0.0.1"
  port: 8084

database:
  path: "data/ideas.db"

auth:
  session_secret: "${RECIPE_PRO_SESSION_SECRET}"
  session_cookie_name: "recipe_pro_session"
  session_max_age_seconds: 2592000
  session_secure: false
  users:
    - username: "user1"
      password_hash: "$2b$12$REPLACE_WITH_BCRYPT_HASH_FOR_USER1"
      db_path: "data/user1.db"
    - username: "user2"
      password_hash: "$2b$12$REPLACE_WITH_BCRYPT_HASH_FOR_USER2"
      db_path: "data/user2.db"
