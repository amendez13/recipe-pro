---
- name: Deploy Recipe Pro systemd service
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Ensure Python virtualenv exists
      ansible.builtin.command:
        cmd: "{{ venv_python }} -m venv {{ app_dir }}/.venv"
        creates: "{{ app_dir }}/.venv/bin/python"
      become_user: "{{ app_user }}"

    - name: Install app dependencies in venv
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/.venv"

    - name: Install systemd unit file
      ansible.builtin.template:
        src: templates/recipe-pro.service
        dest: "/etc/systemd/system/{{ service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart service

    - name: Ensure service is enabled and running
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        method: GET
        status_code: 200
      register: health_result
      retries: 10
      delay: 2
      until: health_result.status == 200

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
