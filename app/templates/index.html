<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Pro</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <div class="shell">
            <div class="brand-block">
                <h1>Recipe Pro</h1>
                <p>Comfort cooking, beautifully organized.</p>
            </div>
            <div class="auth-controls">
                <span id="auth-username" class="auth-username hidden"></span>
                <button id="logout-btn" type="button" class="hidden">Log Out</button>
            </div>
            <nav class="nav-actions">
                <button data-route="list">Recipes</button>
                <button data-route="add">Add Recipe</button>
                <button data-route="shopping">Shopping List</button>
                <button data-route="finder">Recipe Finder</button>
            </nav>
        </div>
    </header>

    <main class="shell" id="app-root"></main>

    <template id="login-view-template">
        <section class="panel login-panel">
            <h2>Log In</h2>
            <p class="muted">Sign in to access your personal recipe space.</p>
            <form id="login-form" class="stack">
                <label>Username<input id="login-username" autocomplete="username" required></label>
                <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
                <label class="row gap align-center remember-check">
                    <input id="login-remember" type="checkbox" checked>
                    <span>Remember me on this browser</span>
                </label>
                <div class="row gap">
                    <button type="submit">Log In</button>
                </div>
                <div id="login-message" class="message"></div>
            </form>
        </section>
    </template>

    <template id="list-view-template">
        <section class="panel">
            <div class="row between gap">
                <input id="recipe-search" type="search" placeholder="Search recipes by title">
                <button id="refresh-recipes">Refresh</button>
            </div>
            <div id="recipe-list-message" class="message"></div>
            <div id="recipe-list" class="grid"></div>
        </section>
    </template>

    <template id="detail-view-template">
        <section class="panel cooking-mode">
            <div id="detail-meta" class="message"></div>
            <h2 id="detail-title"></h2>
            <div class="row gap responsive">
                <aside class="ingredients-panel">
                    <h3>Ingredients</h3>
                    <ul id="detail-ingredients"></ul>
                    <section id="focus-mode-panel" class="focus-mode hidden">
                        <p id="focus-step-counter" class="muted"></p>
                        <div id="focus-step-text" class="focus-step-text"></div>
                        <div class="row gap">
                            <button id="focus-prev" type="button" class="focus-nav-btn">Back</button>
                            <button id="focus-next" type="button" class="focus-nav-btn">Next</button>
                        </div>
                    </section>
                </aside>
                <article>
                    <div class="row between gap align-center">
                        <h3>Steps</h3>
                        <button id="toggle-focus-mode" type="button">Focus Mode</button>
                    </div>
                    <ol id="detail-steps" class="step-list"></ol>
                    <p id="detail-source-url" class="detail-source-url hidden"></p>
                </article>
            </div>
            <div class="row gap">
                <button id="edit-recipe">Edit</button>
                <button id="delete-recipe" class="danger">Delete</button>
                <button id="back-to-list">Back</button>
            </div>
        </section>
    </template>

    <template id="form-view-template">
        <section class="panel">
            <h2 id="form-title">Add Recipe</h2>
            <div class="entry-flow">
                <section id="import-assistant" class="entry-block import-assistant">
                    <div class="entry-block-head">
                        <h3>Import Recipe</h3>
                        <p class="muted">Use a link, a text file, or pasted recipe text. Preview first, then confirm.</p>
                    </div>
                    <div class="import-methods stack">
                        <div class="import-method">
                            <h4>From Link</h4>
                            <div class="row gap responsive">
                                <input id="import-url" type="url" placeholder="Paste recipe URL...">
                                <button type="button" id="import-preview-url-btn">Preview Link</button>
                            </div>
                        </div>
                        <div class="import-method">
                            <h4>From Text File</h4>
                            <div class="row gap responsive">
                                <input id="import-text-file" type="file" accept=".txt,.md,text/plain">
                                <button type="button" id="import-preview-file-btn">Preview File</button>
                            </div>
                        </div>
                        <div class="import-method">
                            <h4>From Text Box</h4>
                            <textarea id="import-text" rows="6" placeholder="Paste full recipe text here..."></textarea>
                            <div class="row gap">
                                <button type="button" id="import-preview-text-btn">Preview Text</button>
                            </div>
                        </div>
                    </div>
                    <div id="import-message" class="message"></div>
                    <div id="import-preview" class="import-preview hidden"></div>
                    <div class="row gap">
                        <button type="button" id="import-confirm-btn" class="hidden">Confirm and Add Recipe</button>
                    </div>
                </section>

                <div class="entry-divider" aria-hidden="true"><span>or</span></div>

                <section class="entry-block manual-entry">
                    <div class="entry-block-head">
                        <h3>Manual Entry</h3>
                        <p class="muted">Type each field yourself and save when ready.</p>
                    </div>
                    <form id="recipe-form" class="stack">
                        <label>Title<input id="f-title" required></label>
                        <label>Category (optional)<input id="f-category" placeholder="Dinner, Soup, Dessert..."></label>
                        <label>Recipe URL (optional)<input id="f-url" type="url" placeholder="https://example.com/recipe"></label>
                        <div class="row between gap align-center">
                            <h3>Steps</h3>
                            <button type="button" id="add-step-row">Add Step</button>
                        </div>
                        <div id="step-rows" class="stack"></div>
                        <div class="row gap responsive">
                            <label>Servings<input id="f-servings" type="number" min="1"></label>
                            <label>Prep Time (min)<input id="f-prep" type="number" min="0"></label>
                            <label>Cook Time (min)<input id="f-cook" type="number" min="0"></label>
                        </div>

                        <div class="row between gap">
                            <h3>Ingredients</h3>
                            <button type="button" id="add-ingredient-row">Add Ingredient</button>
                        </div>
                        <div id="ingredient-rows" class="stack"></div>

                        <div class="row gap">
                            <button type="submit">Save</button>
                            <button type="button" id="cancel-form">Cancel</button>
                        </div>
                        <div id="form-message" class="message"></div>
                    </form>
                </section>
            </div>
        </section>
    </template>

    <template id="shopping-view-template">
        <section class="panel">
            <h2>Shopping List</h2>
            <label>
                Find recipes
                <input id="shopping-recipe-search" type="search" placeholder="Search recipes to include...">
            </label>
            <div id="shopping-selection-meta" class="message"></div>
            <div id="shopping-selected-recipes" class="selected-filter-list"></div>
            <div id="shopping-recipe-results" class="recipe-search-results"></div>
            <div class="row gap">
                <button id="generate-shopping-list">Generate from Selected Recipes</button>
                <button id="clear-shopping-recipes">Clear Recipes</button>
                <button id="clear-shopping">Clear Checks</button>
            </div>
            <div id="shopping-message" class="message"></div>
            <div id="shopping-categories" class="stack"></div>
        </section>
    </template>

    <template id="finder-view-template">
        <section class="panel">
            <h2>Recipe Finder</h2>
            <div class="row gap">
                <button id="finder-toggle-mode">Show Suggestions</button>
                <button id="finder-manage-ingredients">Manage Ingredients</button>
            </div>
            <section id="finder-select-panel">
                <div id="finder-ingredients" class="ingredient-pool"></div>
            </section>
            <section id="finder-results-panel" class="hidden">
                <div id="finder-message" class="message"></div>
                <div id="finder-results" class="stack"></div>
            </section>
        </section>
    </template>

    <template id="ingredients-view-template">
        <section class="panel">
            <h2>Ingredients</h2>
            <label>
                Search ingredients
                <input id="ingredient-default-search" type="search" placeholder="Type to filter ingredients...">
            </label>
            <div id="ingredient-default-message" class="message"></div>
            <div class="ingredient-table-wrap">
                <table class="ingredient-table">
                    <thead>
                        <tr>
                            <th>Default</th>
                            <th>Ingredient</th>
                            <th>Delete</th>
                            <th>Appears In Recipes</th>
                        </tr>
                    </thead>
                    <tbody id="ingredient-default-list"></tbody>
                </table>
            </div>
            <section class="merge-ingredients-panel">
                <h3>Merge Ingredients</h3>
                <p class="muted">Choose a primary ingredient to keep and a secondary ingredient to remove.</p>
                <div class="row gap responsive">
                    <label>Primary
                        <select id="merge-primary"></select>
                    </label>
                    <label>Secondary
                        <select id="merge-secondary"></select>
                    </label>
                </div>
                <div class="row gap">
                    <button type="button" id="merge-preview-btn">Preview Merge</button>
                    <button type="button" id="merge-execute-btn">Merge Now</button>
                </div>
                <label class="row gap align-center merge-confirmation">
                    <input id="merge-confirm-collision" type="checkbox">
                    <span>I understand collision rows will remove the secondary ingredient from those recipes.</span>
                </label>
                <div id="merge-preview-output" class="import-preview hidden"></div>
            </section>
            <section class="merge-history-panel">
                <h3>Merge History</h3>
                <div id="merge-history-list" class="stack"></div>
            </section>
        </section>
    </template>

    <script src="/static/app.js"></script>
</body>
</html>
